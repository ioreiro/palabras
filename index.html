<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5 palabras al día · Alemán</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#1f6feb;--ok:#2a9d4a;--bad:#d1392f;--ln:#e3e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1f2127;--tx:#f0efeb;--mut:#9a99a0;--ac:#5b9bff;--ok:#4cc46d;--bad:#ff6b5f;--ln:#2e3038}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1f2127;--tx:#f0efeb;--mut:#9a99a0;--ac:#5b9bff;--ok:#4cc46d;--bad:#ff6b5f;--ln:#2e3038}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:15px;font-weight:600;color:var(--mut);margin:0 0 14px;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:28px 20px;text-align:center}
.de{font-size:40px;font-weight:700;margin:6px 0}
.fon{font-size:24px;color:var(--ac);margin:4px 0}
.es{font-size:18px;color:var(--mut);margin-bottom:18px}
.dots{font-size:22px;letter-spacing:4px;color:var(--ok);margin:14px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0}
.row button{width:72px;height:72px}
.row .nav{width:44px;height:44px;font-size:20px;background:var(--mut)}
button:disabled{opacity:.3;cursor:default}
textarea{width:100%;box-sizing:border-box;min-height:150px;border:1px solid var(--ln);border-radius:12px;padding:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--tx)}
.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.foot .txt{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.cm{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cm .nav{width:44px;height:44px;font-size:20px;background:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:12px;color:var(--mut)}
.dy{padding:9px 0;border-radius:10px;font-size:15px;color:var(--mut);border:1px solid transparent}
.dy.pn{border-color:var(--ac);color:var(--tx);cursor:pointer}
.dy.dn{background:var(--ok);color:#fff;cursor:pointer}
.dy.td{outline:2px solid var(--tx);font-weight:700}
button{font:inherit;border:0;border-radius:50%;width:76px;height:76px;font-size:32px;background:var(--ac);color:#fff;cursor:pointer}
button.mic.on{background:var(--bad)}
button.txt{width:auto;height:auto;border-radius:12px;font-size:16px;padding:12px 18px;margin-top:10px}
.heard{min-height:48px;font-size:17px;margin-top:8px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.note{color:var(--mut);font-size:14px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<main>
<h1><span id="h1">5 palabras al día</span><span id="h2"></span></h1>
<div class="card" id="c"></div>
<div class="note" id="n"></div>
<div class="foot" id="ft"><button class="txt" id="fc">📅 Días anteriores</button><button class="txt" id="fa">➕ Agregar palabras</button></div>
</main>
<script>
const RAW=`Hallo|jálo|hola
Tschüss|chüs|chau
Danke|dánke|gracias
Bitte|bíte|por favor / de nada
ja|ya|sí
nein|nain|no
Guten Morgen|gúten mórguen|buenos días
Guten Tag|gúten tak|buen día
Gute Nacht|gúte naj|buenas noches
Entschuldigung|entshúldigung|perdón
das Wasser|vásser|el agua
das Brot|brot|el pan
die Milch|milj|la leche
der Kaffee|káfe|el café
der Tee|te|el té
das Essen|ésen|la comida
der Apfel|ápfel|la manzana
der Käse|kése|el queso
das Ei|ai|el huevo
das Fleisch|flaish|la carne
der Fisch|fish|el pescado
das Obst|opst|la fruta
das Gemüse|guemúse|la verdura
der Reis|rais|el arroz
die Suppe|súpe|la sopa
das Haus|jaus|la casa
die Wohnung|vónung|el apartamento
das Zimmer|tsímer|la habitación
die Tür|tür|la puerta
das Fenster|fénster|la ventana
der Tisch|tish|la mesa
der Stuhl|shtul|la silla
das Bett|bet|la cama
die Küche|kúje|la cocina
das Bad|bat|el baño
die Familie|famílie|la familia
die Mutter|múter|la madre
der Vater|fáter|el padre
der Bruder|brúder|el hermano
die Schwester|shvéster|la hermana
das Kind|kint|el niño
der Mann|man|el hombre
die Frau|frau|la mujer
der Freund|froind|el amigo
der Sohn|zon|el hijo
die Tochter|tójter|la hija
ich|ij|yo
du|du|tú
er|er|él
sie|si|ella
wir|vir|nosotros
ihr|ir|vosotros
sein|sain|ser / estar
haben|jáben|tener / haber
gehen|guéen|ir
kommen|kómen|venir
machen|májen|hacer
sprechen|shpréjen|hablar
essen|ésen|comer
trinken|trínken|beber
sehen|séen|ver
hören|jören|escuchar
lernen|lérnen|aprender
wohnen|vónen|vivir (habitar)
arbeiten|árbaiten|trabajar
kaufen|káufen|comprar
wollen|vólen|querer
können|kónen|poder
müssen|músen|tener que
verstehen|fershtéen|entender
eins|ains|uno
zwei|tsvai|dos
drei|drai|tres
vier|fir|cuatro
fünf|fünf|cinco
sechs|sex|seis
sieben|síben|siete
acht|ajt|ocho
neun|noin|nueve
zehn|tsen|diez
heute|hóite|hoy
morgen|mórguen|mañana
gestern|guéstern|ayer
jetzt|yetst|ahora
die Zeit|tsait|el tiempo
der Tag|tak|el día
die Nacht|najt|la noche
die Woche|vóje|la semana
das Jahr|yar|el año
gut|gut|bueno
schlecht|shlejt|malo
groß|gros|grande
klein|klain|pequeño
neu|noi|nuevo
alt|alt|viejo
schön|shön|lindo
heiß|jais|caliente
kalt|kalt|frío
schnell|shnel|rápido
die Stadt|shtat|la ciudad
die Straße|shtráse|la calle
das Auto|áuto|el coche
der Bus|bus|el autobús
der Zug|tsuk|el tren
die Arbeit|árbait|el trabajo
die Schule|shúle|la escuela
das Buch|buj|el libro
das Geld|guelt|el dinero
der Hund|junt|el perro
die Katze|kátse|el gato
wo|vo|dónde
was|vas|qué
wer|ver|quién
warum|varúm|por qué
wie|vi|cómo`;
const BASE=RAW.split("\n").map(l=>l.split("|"));
const custom=(()=>{try{const x=JSON.parse(localStorage.getItem("dwx"));return Array.isArray(x)?x:[]}catch(e){return[]}})();
let W=BASE.concat(custom);
const NEED=10,PASS=0.8;
const $=id=>document.getElementById(id);
const now=new Date();
const key=now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate();

function yomTov(d){
  try{
    const p=new Intl.DateTimeFormat("en-u-ca-hebrew",{day:"numeric",month:"long"}).formatToParts(new Date(d.getFullYear(),d.getMonth(),d.getDate(),12));
    const day=+p.find(x=>x.type==="day").value,m=p.find(x=>x.type==="month").value.toLowerCase();
    if(m.startsWith("tish"))return [1,2,10,15,22].includes(day);
    if(m.startsWith("nis"))return [15,21].includes(day);
    if(m.startsWith("siv"))return day===6;
  }catch(e){}
  return false;
}
const blocked=now.getDay()===6?"Shabat shalom. Hoy no hay palabras.":(yomTov(now)?"Jag sameaj. Hoy es Yom Tov, no hay palabras.":"");

let S=null;
try{S=JSON.parse(localStorage.getItem("dw1"))}catch(e){}
S=S||{ptr:0,day:"",reps:[0,0,0,0,0],i:0,done:false};
S.hist=S.hist||{};S.n=S.n||5;S.i=S.reps.findIndex(x=>x<NEED);if(S.i<0)S.i=S.n;S.done=S.i>=S.n;
if(S.day!==key){S.ptr=(S.ptr+lead())%W.length;S.day=key;S.n=5;S.reps=[0,0,0,0,0];S.i=0;S.done=false}
if(!blocked&&!S.hist[key])S.hist[key]={p:S.ptr,n:S.n,d:S.done};
save();
function save(){try{localStorage.setItem("dw1",JSON.stringify(S))}catch(e){}}

let review=null; // {words,i,reps}
let vi=null,panel=null,cal=null; // palabra que se está viendo (null = la primera pendiente)
const setAt=(p,n=5)=>Array.from({length:n},(_,k)=>W[(p+k)%W.length]);
function lead(){let k=0;while(k<S.n&&S.reps[k]>=NEED)k++;return Math.floor(k/5)*5}
const todayWords=()=>setAt(S.ptr,S.n);
const learned=()=>W.slice(0,S.ptr+lead());

function norm(s){
  s=s.toLowerCase().replace(/ß/g,"ss").replace(/[^a-zäöüß ]/g," ").replace(/\s+/g," ").trim();
  return s.replace(/^(der|die|das|ein|eine) /,"");
}
function sim(a,b){
  const m=a.length,n=b.length;if(!m&&!n)return 1;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return 1-p[n]/Math.max(m,n);
}
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function chime(big){
  try{ac();const t=AC.currentTime;(big?[660,880,1175]:[880,1175]).forEach((hz,k)=>{const o=AC.createOscillator(),g=AC.createGain(),s=t+k*0.12;o.frequency.value=hz;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.3,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.2);o.start(s);o.stop(s+0.22)})}catch(e){}
}
function speak(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=0.8;speechSynthesis.speak(u)}catch(e){}
}

function state(){
  if(review)return {words:review.words,i:review.i,reps:review.reps,need:1};
  return {words:todayWords(),i:S.i,reps:S.reps,need:NEED};
}
function render(feedback){
  const c=$("c");
  $("n").textContent="";
  $("ft").style.display=blocked?"none":"";
  if(panel)return renderPanel();
  if(blocked&&!review){$("h2").textContent="";c.innerHTML="<div class='de' style='font-size:26px'>"+blocked+"</div>";return}
  const st=state();
  const N=st.words.length;$("h1").textContent=review?(review.t||"Repaso"):"Palabras del día";
  if(st.i>=N&&vi===null){
    $("h2").textContent="";
    c.innerHTML="<div class='de' style='font-size:28px'>"+(review?"¡Repaso terminado!":"¡Listo por hoy!")+"</div><div class='es'>Volvé mañana para más palabras.</div>"+(review?"":"<button class='txt' id='mr'>➕ 5 palabras más hoy</button>")+"<button class='txt' id='vw'>Ver las palabras</button>"+(learned().length?"<button class='txt' id='rv'>Repasar palabras anteriores</button>":"")+(review?"<button class='txt' id='bk' style='background:var(--mut)'>Volver</button>":"");
    const rv=$("rv");if(rv)rv.onclick=startReview;
    const mr=$("mr");if(mr)mr.onclick=()=>{S.i=S.n;S.n+=5;S.reps.push(0,0,0,0,0);S.done=false;if(S.hist[key]){S.hist[key].n=S.n;S.hist[key].d=false}save();vi=null;render()};
    const vw=$("vw");if(vw)vw.onclick=()=>{vi=0;render()};
    const bk=$("bk");if(bk)bk.onclick=()=>{review=null;vi=null;render()};
    return;
  }
  const ci=vi===null?st.i:vi,w=st.words[ci],r=st.reps[ci];
  $("h2").textContent=(ci+1)+" / "+N;
  c.innerHTML="<div class='de'>"+(ci+1)+". "+w[0]+"</div><div class='fon'>"+w[1]+"</div><div class='es'>"+w[2]+"</div>"+
    "<div class='dots'>"+"●".repeat(r)+"○".repeat(st.need-r)+"</div>"+
    "<div class='row'><button class='nav' id='pv' aria-label='Anterior'"+(ci===0?" disabled":"")+">◀</button><button id='sp' aria-label='Escuchar'>🔊</button><button id='mc' class='mic' aria-label='Hablar'>🎤</button><button class='nav' id='nx' aria-label='Siguiente'"+(ci===N-1?" disabled":"")+">▶</button></div>"+
    "<div class='heard' id='hd'>"+(feedback||"Tocá 🔊 para escuchar y 🎤 para decirla.")+"</div>"+
    (!review&&learned().length?"<button class='txt' id='rv'>Repasar anteriores</button>":"");
  $("sp").onclick=()=>speak(w[0]);
  $("mc").onclick=()=>listen(w,ci);
  $("pv").onclick=()=>{vi=Math.max(0,ci-1);render()};
  $("nx").onclick=()=>{vi=Math.min(N-1,ci+1);render()};
  const rv=$("rv");if(rv)rv.onclick=startReview;
}
function renderPanel(){
  const c=$('c');
  $('h2').textContent='';
  if(panel==='add'){
    $('h1').textContent='Agregar palabras';
    c.innerHTML=`<div class='es' style='margin-bottom:10px'>Una por línea:<br><b>alemán|fonética|castellano</b></div><textarea id='ta' placeholder='der Hund|junt|el perro'></textarea><div class='row'><button class='txt' id='sv'>Guardar</button><button class='txt' id='cn' style='background:var(--mut)'>Volver</button></div><div class='heard' id='hd'>Palabras en la lista: ${W.length}</div>`;
    $('cn').onclick=()=>{panel=null;render()};
    $('sv').onclick=()=>{
      const have=new Set(W.map(x=>x[0].toLowerCase())),add=[];
      $('ta').value.split('\n').forEach(l=>{const p=l.split(/[|\t;]/).map(x=>x.trim());if(p.length>=3&&p[0]&&p[1]&&p[2]&&!have.has(p[0].toLowerCase())){have.add(p[0].toLowerCase());add.push(p.slice(0,3))}});
      if(!add.length){$('hd').innerHTML=`<span class='bad'>No encontré palabras nuevas con ese formato.</span>`;return}
      custom.push(...add);W=BASE.concat(custom);
      try{localStorage.setItem('dwx',JSON.stringify(custom))}catch(e){}
      $('ta').value='';$('hd').innerHTML=`<span class='ok'>✔ Agregué ${add.length} palabras. Total: ${W.length}</span>`;
    };
    return;
  }
  const t=new Date();cal=cal||{y:t.getFullYear(),m:t.getMonth()};
  const base=new Date(cal.y,cal.m,1),first=base.getDay(),dim=new Date(cal.y,cal.m+1,0).getDate();
  const ms=base.toLocaleDateString('es',{month:'short'});
  let g=['D','L','M','M','J','V','S'].map(x=>`<div class='wd'>${x}</div>`).join('');
  for(let k=0;k<first;k++)g+='<div></div>';
  for(let d=1;d<=dim;d++){
    const k=`${cal.y}-${cal.m+1}-${d}`,h=S.hist[k];
    g+=`<div class='dy${h?(h.d?' dn':' pn'):''}${k===key?' td':''}' data-k='${k}'>${d}</div>`;
  }
  $('h1').textContent='Días anteriores';
  c.innerHTML=`<div class='cm'><button class='nav' id='cp'>◀</button><b>${base.toLocaleDateString('es',{month:'long',year:'numeric'})}</b><button class='nav' id='cx'>▶</button></div><div class='grid'>${g}</div><div class='es' style='font-size:14px;margin:12px 0 0'>Verde = completado · Borde = empezado. Tocá un día para repasar sus palabras.</div><button class='txt' id='cb' style='background:var(--mut)'>Volver</button>`;
  $('cp').onclick=()=>{cal.m--;if(cal.m<0){cal.m=11;cal.y--}render()};
  $('cx').onclick=()=>{cal.m++;if(cal.m>11){cal.m=0;cal.y++}render()};
  $('cb').onclick=()=>{panel=null;render()};
  c.querySelectorAll('.dy').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k,h=S.hist[k];if(!h)return;
    panel=null;vi=null;
    review=k===key?null:{words:setAt(h.p,h.n||5),i:0,reps:Array(h.n||5).fill(0),t:`Repaso · ${el.textContent} ${ms}`};
    render();
  });
}
function startReview(){
  const L=learned().slice().sort(()=>Math.random()-.5).slice(0,5);
  review={words:L,i:0,reps:[0,0,0,0,0]};vi=null;
  if(L.length<5){/* pad so it always has 5 slots */while(review.words.length<5)review.words.push(L[review.words.length%L.length])}
  render();
}
function check(alts,w,ci){
  const t=norm(w[0]);
  const best=Math.max(...alts.slice(0,2).map(a=>sim(norm(a),t)));
  const heard="Escuché: “"+alts[0]+"”";
  const st=state();
  if(best>=PASS){
    const was=st.reps[ci]>=st.need;
    if(!was)st.reps[ci]++;
    const p=st.reps.findIndex(x=>x<st.need),pi=p<0?st.words.length:p;
    if(review)review.i=pi;else{S.i=pi;if(pi>=st.words.length){S.done=true;if(S.hist[key])S.hist[key].d=true}}
    const fin=!was&&st.reps[ci]>=st.need;chime(fin);if(fin)vi=null;
    if(!review)save();
    render("<span class='ok'>✔ "+heard+"</span>");
  }else{
    $("hd").innerHTML="<span class='bad'>✘ "+heard+"</span><br>Probá de nuevo.";
  }
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(w,ci){
  ac();
  if(!SR){$("hd").textContent="Este navegador no tiene reconocimiento de voz. Abrilo en Chrome de Android.";return}
  const r=new SR();r.lang="de-DE";r.maxAlternatives=3;r.interimResults=false;
  const mc=$("mc");mc.classList.add("on");$("hd").textContent="Escuchando…";
  let got=false;
  r.onresult=e=>{got=true;check([...e.results[0]].map(a=>a.transcript),w,ci)};
  r.onerror=e=>{got=true;$("hd").innerHTML="<span class='bad'>Micrófono: "+e.error+"</span>"};
  r.onend=()=>{mc.classList.remove("on");if(!got&&$("hd"))$("hd").textContent="No te escuché. Probá de nuevo."};
  try{r.start()}catch(e){}
}
$("fc").onclick=()=>{panel="cal";render()};
$("fa").onclick=()=>{panel="add";render()};
render();
</script>
</body>
</html>
